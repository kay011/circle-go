# Server configuration
server:
  host: 0.0.0.0
  port: 8080

# LLM configuration
llm:
  api_key: "your-openai-api-key"
  model: "gpt-4"
  base_url: "https://api.openai.com/v1"
  max_tokens: 1000
  temperature: 0.7

# Memory configuration
memory:
  short_term_size: 24
  long_term_path: "./memory"
  compress_min_messages: 10
  compress_trigger_ratio: 0.75
  long_term_max_items: 120
  context_injection_k: 8
  # long_term_mode: file（默认，仅 JSON）| vector（JSON + 本地向量文件，语义检索需有效 api_key）
  long_term_mode: "file"
  embedding_model: "text-embedding-3-small"
  redis:
    enabled: false
    addr: "127.0.0.1:6379"
    password: ""
    db: 0
    key_prefix: "circle:"

# OTLP 追踪（可对接 Langfuse / Jaeger / Grafana Tempo；Langfuse 见官方 OTLP endpoint 文档）
observability:
  enabled: false
  otlp_endpoint: "http://localhost:4318/v1/traces"
  service_name: "circle-go"
  insecure: true

# 多智能体 YAML（execution_mode: react | plan_execute）
agents:
  definitions_file: "agents/agents.yaml"

# MCP configuration
mcp:
  enabled: false
  url: "http://localhost:8000"

# 搜索（web_search 工具：零 API Key，DuckDuckGo + SearxNG 聚合）
# web_search_mock: true 时不访问外网，返回固定模拟结果（联调/无外网）；上线请改为 false
# 若 searx_instances 留空则使用内置公共 Searx 实例列表
search:
  web_search_mock: false
  searx_instances:
    - "https://searx.tiekoetter.com"
    - "https://searx.be"

# Usage:
# 1. Copy this file to config.yaml
# 2. Replace "your-openai-api-key" with your actual OpenAI API key
# 3. Adjust other settings as needed