<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e8f4f2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>注册 · Circle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <a href="login.html" class="auth-back"><i class="fas fa-arrow-left"></i>返回登录</a>
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="fas fa-comments"></i>
            </div>
            <span>Circle</span>
        </div>
        <h1 class="auth-page-title">注册账号</h1>
        <form id="registerForm">
            <div class="auth-field">
                <label for="regUsername">用户名</label>
                <input id="regUsername" name="username" required autocomplete="username" placeholder="用户名" />
            </div>
            <div class="auth-field">
                <label for="regEmail">邮箱</label>
                <input id="regEmail" name="email" type="email" required autocomplete="email" placeholder="邮箱" />
            </div>
            <div class="auth-field">
                <label for="regPassword">密码</label>
                <input id="regPassword" name="password" type="password" required autocomplete="new-password" placeholder="密码" />
            </div>
            <button type="submit" class="auth-submit" id="registerSubmit">注册</button>
        </form>
        <p class="auth-footer">已有账号？<a href="login.html" class="auth-link-inline">去登录</a></p>
    </div>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            var t = Auth.getToken();
            if (t) {
                try {
                    var res = await fetch('/api/auth/me', {
                        headers: { Authorization: 'Bearer ' + t }
                    });
                    if (res.ok) {
                        window.location.replace('index.html');
                        return;
                    }
                } catch (e) { /* */ }
                Auth.clearAuth();
            }

            document.getElementById('registerForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                var btn = document.getElementById('registerSubmit');
                var u = document.getElementById('regUsername').value.trim();
                var em = document.getElementById('regEmail').value.trim();
                var p = document.getElementById('regPassword').value;
                btn.disabled = true;
                try {
                    var res = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: u, password: p, email: em })
                    });
                    var text = await res.text();
                    var data;
                    try {
                        data = JSON.parse(text);
                    } catch (err) {
                        throw new Error(text || '注册失败');
                    }
                    if (!res.ok) {
                        throw new Error((data && data.message) || text || '注册失败');
                    }
                    window.location.href = 'login.html?registered=1';
                } catch (err) {
                    alert(err.message || '注册失败');
                } finally {
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
