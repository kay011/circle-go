<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#fbfdfc">
    <meta name="format-detection" content="telephone=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <title>Circle · AI Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Markdown 渲染和代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* 浅绿主题 · 参考豆包式清爽布局 */
            --primary-color: #0d9488;
            --primary-hover: #0f766e;
            --primary-soft: rgba(13, 148, 136, 0.12);
            --accent-glow: rgba(45, 212, 191, 0.28);
            --bg-color: #eef5f2;
            --bg-page:
                radial-gradient(ellipse 100% 70% at 50% 0%, rgba(13, 148, 136, 0.08), transparent 55%),
                linear-gradient(180deg, #e8f2ee 0%, #f2f7f5 45%, #f6f9f8 100%);
            --chat-bg: #fbfdfc;
            --ai-msg-bg: #ffffff;
            --ai-msg-border: rgba(13, 148, 136, 0.12);
            --ai-msg-accent: #0d9488;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: rgba(15, 23, 42, 0.09);
            --radius-app: 24px;
            --radius-md: 12px;
            --radius-bubble: 16px;
            --shadow-app: 0 8px 32px rgba(15, 23, 42, 0.1), 0 2px 8px rgba(15, 23, 42, 0.06);
            --shadow-bubble-ai: 0 2px 8px rgba(15, 23, 42, 0.06);
            /* iOS 优先：系统 SF + 苹方 / 冬青黑，贴近豆包 iOS 端字重与排版 */
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            --ios-separator: rgba(60, 60, 67, 0.29);
            --ios-fill-quaternary: rgba(120, 120, 128, 0.12);
        }

        html {
            height: 100%;
            background-color: var(--bg-color);
        }

        body {
            font-family: var(--font);
            background: var(--bg-page);
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-size: 15px;
            line-height: 1.6;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            -webkit-tap-highlight-color: transparent;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            padding: 0;
            margin: 0;
            touch-action: pan-y;
        }

        /* 全屏沉浸式外壳（仿豆包 App 主界面） */
        .app-container {
            max-width: 100%;
            width: 100%;
            margin: 0;
            height: 100vh;
            height: 100dvh;
            max-height: 100vh;
            max-height: 100dvh;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            border: none;
            border-radius: 0;
            overflow: hidden;
            box-shadow: none;
        }

        /* 顶栏：豆包 iOS — 导航栏材质 + 细分割线（UIKit 风格） */
        .header {
            flex-shrink: 0;
            padding: 0;
            padding-top: max(0px, env(safe-area-inset-top));
            border-bottom: 0.33px solid var(--ios-separator);
            background: rgba(249, 249, 249, 0.82);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            z-index: 10;
        }

        .header-inner {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            min-height: 44px;
            padding: 4px 8px;
            padding-left: max(8px, env(safe-area-inset-left));
            padding-right: max(8px, env(safe-area-inset-right));
            box-sizing: border-box;
        }

        .header-start {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .header-center {
            justify-self: center;
            text-align: center;
            min-width: 0;
            max-width: min(56vw, 280px);
        }

        .header-product {
            margin: 0;
            padding: 0;
            font-size: 17px;
            font-weight: 590;
            letter-spacing: -0.022em;
            color: #000;
            line-height: 1.29;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        @supports not (font-weight: 590) {
            .header-product {
                font-weight: 600;
            }
        }

        .header-end {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .header-bar-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #3d3d3d;
            font-size: 18px;
            transition: background 0.18s ease, color 0.18s ease;
        }

        @media (hover: hover) {
            .header-bar-btn:hover {
                background: rgba(13, 148, 136, 0.08);
                color: #2d3748;
            }
        }

        .header-bar-btn:active {
            background: var(--ios-fill-quaternary);
            opacity: 0.92;
        }

        .header-bar-btn:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .btn-icon {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: background 0.18s ease, color 0.18s ease;
        }

        .btn-icon:hover {
            background: rgba(13, 148, 136, 0.08);
            color: var(--text-primary);
        }

        .btn-icon:focus-visible {
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        /* 会话栏：浅青底 */
        .session-bar {
            padding: 12px 22px;
            border-bottom: 1px solid rgba(13, 148, 136, 0.12);
            display: flex;
            align-items: center;
            gap: 12px;
            background: linear-gradient(180deg, #ecfdf5 0%, #f0fdf9 100%);
        }

        .session-select {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            background: #fff;
            cursor: pointer;
            outline: none;
            color: var(--text-primary);
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .session-select:hover {
            border-color: rgba(13, 148, 136, 0.4);
        }

        .session-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px var(--primary-soft);
        }

        .btn-new-session {
            min-height: 44px;
            padding: 0 18px;
            background: var(--primary-color);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            font-family: inherit;
            letter-spacing: -0.01em;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.15s ease, transform 0.1s ease, opacity 0.15s;
            box-shadow: 0 1px 3px rgba(13, 148, 136, 0.35);
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        @media (hover: hover) {
            .btn-new-session:hover {
                background: var(--primary-hover);
            }
        }

        .btn-new-session:active {
            transform: scale(0.98);
            opacity: 0.92;
        }

        /* 聊天区：iOS 惯性滚动 + 避免父级橡皮筋 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            min-height: 0;
            padding: 16px max(16px, env(safe-area-inset-left)) 20px max(16px, env(safe-area-inset-right));
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: contain;
            background: linear-gradient(180deg, #fafafa 0%, #f6faf8 45%, #f3f7f5 100%);
        }

        .chat-container::-webkit-scrollbar {
            width: 8px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: rgba(15, 23, 42, 0.12);
            border-radius: 8px;
            border: 2px solid transparent;
            background-clip: padding-box;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: rgba(15, 23, 42, 0.2);
            background-clip: padding-box;
        }

        .messages-wrapper {
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-width: 720px;
            margin: 0 auto;
        }

        .message {
            display: flex;
            gap: 14px;
            animation: messageSlideIn 0.38s cubic-bezier(0.22, 1, 0.36, 1);
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 15px;
            box-shadow: var(--shadow-bubble-ai);
        }

        .message.ai .message-avatar {
            background: linear-gradient(145deg, #2dd4bf 0%, var(--primary-color) 55%, #0f766e 100%);
            color: white;
            box-shadow: 0 2px 12px rgba(13, 148, 136, 0.35);
        }

        .message.user .message-avatar {
            background: linear-gradient(180deg, #fff 0%, #eef0f5 100%);
            color: var(--text-secondary);
            border: 1px solid rgba(15, 23, 42, 0.06);
        }

        .message-content-wrapper {
            max-width: min(72%, 520px);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .message.user .message-content-wrapper {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 13px 17px;
            border-radius: var(--radius-bubble);
            line-height: 1.65;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.ai .message-bubble {
            background: #fff;
            color: var(--text-primary);
            border: 1px solid rgba(13, 148, 136, 0.1);
            border-radius: 18px;
            border-top-left-radius: 6px;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #5eead4 0%, var(--primary-color) 48%, #0d9488 100%);
            color: #fff;
            border-radius: 18px;
            border-top-right-radius: 6px;
            box-shadow: 0 4px 16px rgba(13, 148, 136, 0.22);
        }

        /* Markdown */
        .message-bubble.markdown-content {
            white-space: normal;
        }

        .message-bubble.markdown-content h1,
        .message-bubble.markdown-content h2,
        .message-bubble.markdown-content h3 {
            font-weight: 650;
            letter-spacing: -0.02em;
            margin: 14px 0 8px;
            line-height: 1.35;
            color: var(--text-primary);
        }

        .message-bubble.markdown-content h1 { font-size: 1.35rem; }
        .message-bubble.markdown-content h2 { font-size: 1.2rem; }
        .message-bubble.markdown-content h3 { font-size: 1.05rem; }

        .message-bubble.markdown-content p {
            margin: 9px 0;
        }

        .message-bubble.markdown-content p:first-child {
            margin-top: 0;
        }

        .message-bubble.markdown-content p:last-child {
            margin-bottom: 0;
        }

        .message-bubble.markdown-content a {
            color: var(--primary-color);
            text-decoration: none;
            border-bottom: 1px solid rgba(13, 148, 136, 0.35);
        }

        .message-bubble.markdown-content a:hover {
            border-bottom-color: var(--primary-color);
        }

        .message.user .message-bubble.markdown-content a {
            color: #e8ecff;
            border-bottom-color: rgba(255, 255, 255, 0.45);
        }

        .message-bubble.markdown-content code {
            background: rgba(13, 148, 136, 0.09);
            padding: 2px 7px;
            border-radius: 6px;
            font-family: ui-monospace, 'SF Mono', 'Consolas', 'Monaco', monospace;
            font-size: 0.88em;
        }

        .message.user .message-bubble.markdown-content code {
            background: rgba(255, 255, 255, 0.22);
        }

        .message-bubble.markdown-content pre {
            background: linear-gradient(165deg, #1a1d24 0%, #14161c 100%);
            padding: 14px 16px;
            border-radius: 10px;
            overflow-x: auto;
            margin: 12px 0;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .message-bubble.markdown-content pre code {
            background: transparent;
            padding: 0;
            color: #e4e6eb;
        }

        .message-bubble.markdown-content ul,
        .message-bubble.markdown-content ol {
            margin: 8px 0;
            padding-left: 22px;
        }

        .message-bubble.markdown-content li {
            margin: 5px 0;
        }

        .message-bubble.markdown-content hr {
            border: none;
            height: 1px;
            background: var(--border-color);
            margin: 16px 0;
        }

        .message-bubble.markdown-content blockquote {
            border-left: 3px solid var(--primary-color);
            padding: 6px 0 6px 14px;
            margin: 10px 0;
            color: var(--text-secondary);
            background: rgba(13, 148, 136, 0.04);
            border-radius: 0 8px 8px 0;
        }

        .message-bubble.markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
            font-size: 14px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .message-bubble.markdown-content th,
        .message-bubble.markdown-content td {
            border: 1px solid var(--border-color);
            padding: 9px 12px;
            text-align: left;
        }

        .message-bubble.markdown-content th {
            background: rgba(13, 148, 136, 0.07);
            font-weight: 600;
        }

        /* 思考 / 工具过程：嵌在同一 AI 气泡顶部，弱样式折叠 */
        .message-bubble.combined-ai-bubble {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: stretch;
        }

        .combined-answer-root {
            min-height: 0;
        }

        .combined-answer-root:empty {
            min-height: 0;
        }

        .aux-chain {
            border-radius: 12px;
            background: rgba(120, 120, 128, 0.06);
            border: 0.33px solid rgba(60, 60, 67, 0.12);
            overflow: hidden;
        }

        .aux-chain > summary {
            list-style: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            color: rgba(60, 60, 67, 0.55);
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .aux-chain > summary::-webkit-details-marker {
            display: none;
        }

        .aux-title {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .aux-title i {
            font-size: 11px;
            opacity: 0.75;
        }

        .aux-status {
            font-size: 11px;
            font-weight: 400;
            color: rgba(60, 60, 67, 0.45);
        }

        .aux-chain--done > summary {
            padding: 6px 12px;
            color: rgba(60, 60, 67, 0.42);
        }

        .aux-chain--done > summary .aux-status {
            display: none;
        }

        .aux-chain-body {
            padding: 0 10px 10px 12px;
            border-top: 0.33px solid rgba(60, 60, 67, 0.08);
        }

        .aux-item {
            margin-top: 8px;
            font-size: 12px;
            color: rgba(60, 60, 67, 0.72);
            line-height: 1.45;
        }

        .aux-item:first-child {
            margin-top: 6px;
        }

        .aux-k {
            display: block;
            font-size: 11px;
            color: rgba(60, 60, 67, 0.45);
            margin-bottom: 2px;
        }

        .aux-item-name {
            font-weight: 600;
            color: rgba(60, 60, 67, 0.85);
        }

        .aux-line {
            margin-top: 6px;
            font-size: 12px;
            color: rgba(60, 60, 67, 0.5);
            line-height: 1.4;
        }

        .aux-pre {
            margin: 6px 0 0;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.65);
            border: 0.33px solid rgba(60, 60, 67, 0.1);
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 11px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 160px;
            overflow: auto;
            color: rgba(60, 60, 67, 0.75);
        }

        .aux-result-block {
            margin-top: 8px;
        }

        .aux-result-block > summary {
            list-style: none;
            cursor: pointer;
            font-size: 11px;
            color: rgba(60, 60, 67, 0.48);
            padding: 4px 0;
            user-select: none;
        }

        .aux-result-block > summary::-webkit-details-marker {
            display: none;
        }

        .aux-result-pre {
            margin: 4px 0 0;
            padding: 8px 10px;
            border-radius: 8px;
            background: rgba(30, 32, 40, 0.92);
            color: #c5c8d0;
            font-family: ui-monospace, "SF Mono", Menlo, monospace;
            font-size: 10px;
            line-height: 1.45;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: min(36vh, 240px);
            overflow-y: auto;
        }

        .message-bubble.stream-error {
            background: linear-gradient(180deg, #fff5f5 0%, #fffbfc 100%);
            color: #c41e3a;
            border: 1px solid rgba(196, 30, 58, 0.2);
        }

        .message-bubble.streaming {
            border: 1px dashed rgba(13, 148, 136, 0.35);
            background: linear-gradient(180deg, #fff 0%, #fafbff 100%);
        }

        .message-bubble.html-embed {
            white-space: normal;
        }

        .message-time {
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
            padding: 0 6px;
            letter-spacing: 0.02em;
            opacity: 0.85;
        }

        .message.user .message-time {
            text-align: right;
        }

        /* 打字指示 */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding: 14px 18px;
            background: #fff;
            border: 1px solid rgba(13, 148, 136, 0.1);
            border-radius: 18px;
            border-top-left-radius: 6px;
            width: fit-content;
            box-shadow: 0 2px 12px rgba(15, 23, 42, 0.04);
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--primary-color);
            opacity: 0.45;
            border-radius: 50%;
            animation: typing 1.35s ease-in-out infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.18s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.36s;
        }

        @keyframes typing {
            0%, 70%, 100% {
                transform: translateY(0);
                opacity: 0.35;
            }
            35% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* 输入区：贴近 iOS 底部 Composer + Home Indicator 留白 */
        .input-area {
            padding-top: 8px;
            padding-left: max(12px, env(safe-area-inset-left));
            padding-right: max(12px, env(safe-area-inset-right));
            padding-bottom: max(16px, calc(env(safe-area-inset-bottom) + 6px));
            border-top: 0.33px solid var(--ios-separator);
            background: rgba(249, 249, 249, 0.88);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
        }

        .input-wrapper {
            max-width: 720px;
            margin: 0 auto;
            position: relative;
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 8px;
            padding: 8px 10px 8px 16px;
            background: #e9e9eb;
            border-radius: 24px;
            border: none;
            box-shadow: inset 0 0 0 0.33px rgba(60, 60, 67, 0.18);
            transition: box-shadow 0.2s, background 0.2s;
        }

        .input-box:focus-within {
            background: #fff;
            box-shadow:
                inset 0 0 0 0.33px rgba(13, 148, 136, 0.45),
                0 0 0 3px var(--primary-soft);
        }

        .message-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 17px;
            line-height: 1.47;
            resize: none;
            outline: none;
            max-height: 120px;
            min-height: 26px;
            font-family: inherit;
            color: #000;
        }

        .message-input::placeholder {
            color: rgba(60, 60, 67, 0.6);
        }

        .send-button {
            width: 36px;
            height: 36px;
            border: none;
            background: linear-gradient(155deg, #5eead4 0%, var(--primary-color) 55%, #0f766e 100%);
            color: white;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.15s ease, box-shadow 0.2s ease, opacity 0.2s;
            flex-shrink: 0;
            box-shadow: 0 1px 4px rgba(13, 148, 136, 0.28);
            touch-action: manipulation;
        }

        @media (hover: hover) {
            .send-button:hover:not(:disabled) {
                transform: scale(1.04);
                box-shadow: 0 3px 12px rgba(13, 148, 136, 0.32);
            }
        }

        .send-button:active:not(:disabled) {
            transform: scale(0.94);
            opacity: 0.9;
        }

        .send-button:disabled {

    <script src="auth.js"></script>
    <script>
        let currentSessionId = generateSessionId();
        let isStreaming = false;
        let messages = []; // 存储所有消息
        const chatContainer = document.getElementById('chatContainer');
        const messagesWrapper = document.getElementById('messagesWrapper');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messageInput = document.getElementById('messageInput');
        const sendButton = document.getElementById('sendButton');
        const sidebarEl = document.getElementById('sidebar');
        const sidebarBackdropEl = document.getElementById('sidebarBackdrop');
        const sidebarHistoryListEl = document.getElementById('sidebarHistoryList');
        const userDropdownEl = document.getElementById('userDropdown');
        const userAvatarBtnEl = document.getElementById('userAvatarBtn');

        /** 本轮流式：同一 AI 气泡内「工具区 + 正文区」 */
        let streamCombinedCtx = null;

        let authRedirectSuppressed = false;

        function avatarLetter(username) {
            if (!username || !String(username).trim()) return '?';
            return String(username).trim()[0].toUpperCase();
        }

        function updateUserUI(username) {
            document.getElementById('userAvatarLetter').textContent = avatarLetter(username);
            document.getElementById('userDropdownName').textContent = username || '';
        }

        function closeUserDropdown() {
            userDropdownEl.hidden = true;
            userAvatarBtnEl.setAttribute('aria-expanded', 'false');
        }

        function toggleUserDropdown() {
            closeSidebar();
            const open = userDropdownEl.hidden;
            userDropdownEl.hidden = !open;
            userAvatarBtnEl.setAttribute('aria-expanded', open ? 'true' : 'false');
        }

        function openSidebar() {
            closeUserDropdown();
            sidebarEl.classList.add('open');
            sidebarBackdropEl.hidden = false;
            sidebarEl.setAttribute('aria-hidden', 'false');
        }

        function closeSidebar() {
            sidebarEl.classList.remove('open');
            sidebarBackdropEl.hidden = true;
            sidebarEl.setAttribute('aria-hidden', 'true');
        }

        async function authFetch(url, opts) {
            const o = opts || {};
            const headers = new Headers(o.headers || {});
            const t = Auth.getToken();
            if (t) headers.set('Authorization', 'Bearer ' + t);
            if (o.body && typeof o.body === 'string' && !headers.has('Content-Type')) {
                headers.set('Content-Type', 'application/json');
            }
            const res = await fetch(url, Object.assign({}, o, { headers }));
            if (res.status === 401 && !authRedirectSuppressed) {
                Auth.clearAuth();
                closeUserDropdown();
                window.location.replace('login.html');
            }
            return res;
        }

        async function bootstrapAuth() {
            const token = Auth.getToken();
            const savedName = Auth.getSavedUsername();
            if (!token) {
                window.location.replace('login.html');
                return false;
            }
            try {
                const res = await fetch('/api/auth/me', {
                    headers: { Authorization: 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('unauthorized');
                const data = await res.json();
                const name = data.username || savedName || '';
                updateUserUI(name);
                refreshSidebarHistory();
                return true;
            } catch (e) {
                Auth.clearAuth();
                window.location.replace('login.html');
                return false;
            }
        }

        async function logout() {
            authRedirectSuppressed = true;
            try {
                await authFetch('/api/auth/logout', { method: 'POST' });
            } catch (e) {
                /* ignore */
            }
            authRedirectSuppressed = false;
            Auth.clearAuth();
            closeUserDropdown();
            window.location.replace('login.html');
        }

        // 生成会话ID
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // 自动调整输入框高度
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        // 处理键盘事件
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        let scrollScheduled = false;
        function scrollToBottom() {
            if (scrollScheduled) return;
            scrollScheduled = true;
            requestAnimationFrame(() => {
                scrollScheduled = false;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatMessageTime(ts) {
            if (ts == null || ts === '') return '';
            try {
                const d = typeof ts === 'string' || typeof ts === 'number' ? new Date(ts) : ts;
                if (isNaN(d.getTime())) return '';
                return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch (_) {
                return '';
            }
        }

        function highlightCodeIn(bubble) {
            if (!bubble || typeof hljs === 'undefined') return;
            bubble.querySelectorAll('pre code').forEach((block) => {
                try {
                    hljs.highlightElement(block);
                } catch (_) { /* 流式阶段可能不完整 */ }
            });
        }

        function configureMarked() {
            if (typeof marked === 'undefined') return;
            if (typeof marked.use === 'function') {
                try {
                    marked.use({ breaks: true });
                } catch (_) {
                    if (typeof marked.setOptions === 'function') {
                        marked.setOptions({ breaks: true });
                    }
                }
            } else if (typeof marked.setOptions === 'function') {
                marked.setOptions({ breaks: true });
            }
        }

        function renderMarkdownToBubble(bubble, text) {
            if (!bubble) return;
            bubble.classList.add('markdown-content');
            try {
                if (typeof marked !== 'undefined') {
                    bubble.innerHTML = marked.parse(text || '');
                } else {
                    bubble.textContent = text || '';
                }
            } catch (e) {
                bubble.textContent = text || '';
            }
            highlightCodeIn(bubble);
        }

        /** 按 SSE 规范用 \n\n 分隔事件，拼接同事件内多行 data: */
        function consumeSSEBuffer(buffer) {
            const events = [];
            let rest = buffer;
            let idx;
            while ((idx = rest.indexOf('\n\n')) !== -1) {
                const raw = rest.slice(0, idx);
                rest = rest.slice(idx + 2);
                const lines = raw.split('\n');
                const parts = [];
                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        const payload = line.startsWith('data: ') ? line.slice(6) : line.slice(5).replace(/^\s/, '');
                        parts.push(payload);
                    }
                }
                if (parts.length) {
                    events.push(parts.join('\n'));
                }
            }
            return { events, rest };
        }

        function tryParseToolCallPayload(data) {
            const t = data.trim();
            if (!t.startsWith('{') || t.indexOf('tool_call') === -1) return null;
            try {
                const o = JSON.parse(t);
                if (o && o.tool_call && typeof o.tool_call === 'object') return o;
            } catch (_) { /* 非 JSON */ }
            return null;
        }

        function resetStreamTurnState() {
            streamCombinedCtx = null;
        }

        function getOrCreateCombinedMessage() {
            if (streamCombinedCtx) return streamCombinedCtx;
            hideWelcomeScreen();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            const outerBubble = document.createElement('div');
            outerBubble.className = 'message-bubble combined-ai-bubble markdown-content streaming';
            const mainEl = document.createElement('div');
            mainEl.className = 'combined-answer-root';
            outerBubble.appendChild(mainEl);
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            contentWrapper.appendChild(outerBubble);
            contentWrapper.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentWrapper);
            messagesWrapper.appendChild(messageDiv);
            messages.push({ role: 'ai', element: messageDiv, type: 'streaming', content: '' });
            streamCombinedCtx = {
                messageDiv,
                outerBubble,
                mainEl,
                auxWrap: null,
                detailsEl: null,
                bodyEl: null,
                statusEl: null
            };
            scrollToBottom();
            return streamCombinedCtx;
        }

        function ensureAuxBlockInCombined() {
            const ctx = getOrCreateCombinedMessage();
            if (ctx.auxWrap) return ctx;
            const auxWrap = document.createElement('div');
            auxWrap.className = 'aux-inline-wrap';
            const details = document.createElement('details');
            details.className = 'aux-chain';
            details.open = false;
            const summary = document.createElement('summary');
            summary.innerHTML = '<span class="aux-title"><i class="fas fa-ellipsis-h"></i><span>思考中 · Exploring</span></span><span class="aux-status">···</span>';
            const body = document.createElement('div');
            body.className = 'aux-chain-body';
            details.appendChild(summary);
            details.appendChild(body);
            auxWrap.appendChild(details);
            ctx.outerBubble.insertBefore(auxWrap, ctx.mainEl);
            const statusEl = summary.querySelector('.aux-status');
            ctx.auxWrap = auxWrap;
            ctx.detailsEl = details;
            ctx.bodyEl = body;
            ctx.statusEl = statusEl;
            scrollToBottom();
            return ctx;
        }

        function appendToolCallJsonToAux(rawJson) {
            const ctx = ensureAuxBlockInCombined();
            let data;
            try {
                data = JSON.parse(rawJson);
            } catch (e) {
                return;
            }
            const tc = data.tool_call;
            if (!tc || typeof tc !== 'object') return;
            const name = escapeHtml(String(tc.name || ''));
            let argsStr = '';
            try {
                argsStr = tc.arguments != null ? JSON.stringify(tc.arguments, null, 2) : '';
            } catch (e) {
                argsStr = String(tc.arguments);
            }
            const div = document.createElement('div');
            div.className = 'aux-item';
            div.innerHTML = '<span class="aux-k">调用</span><span class="aux-item-name">' + name + '</span><pre class="aux-pre">' + escapeHtml(argsStr) + '</pre>';
            ctx.bodyEl.appendChild(div);
            scrollToBottom();
        }

        function appendAuxMutedLine(text) {
            const ctx = ensureAuxBlockInCombined();
            const div = document.createElement('div');
            div.className = 'aux-line';
            div.textContent = text;
            ctx.bodyEl.appendChild(div);
            scrollToBottom();
        }

        function appendToolResultToAuxPanel(body) {
            const ctx = ensureAuxBlockInCombined();
            const wrap = document.createElement('details');
            wrap.className = 'aux-result-block';
            wrap.open = false;
            const sum = document.createElement('summary');
            sum.textContent = '执行结果';
            const pre = document.createElement('pre');
            pre.className = 'aux-result-pre';
            pre.textContent = body;
            wrap.appendChild(sum);
            wrap.appendChild(pre);
            ctx.bodyEl.appendChild(wrap);
            scrollToBottom();
        }

        function finalizeStreamAuxPanel() {
            if (!streamCombinedCtx || !streamCombinedCtx.auxWrap) return;
            const ctx = streamCombinedCtx;
            const { detailsEl, statusEl } = ctx;
            if (statusEl) {
                statusEl.textContent = '';
            }
            detailsEl.open = false;
            detailsEl.classList.add('aux-chain--done');
            streamCombinedCtx = null;
            scrollToBottom();
        }

        // 隐藏欢迎界面
        function hideWelcomeScreen() {
            welcomeScreen.style.display = 'none';
            messagesWrapper.style.display = 'flex';
        }

        // 显示欢迎界面
        function showWelcomeScreen() {
            if (messages.length === 0) {
                welcomeScreen.style.display = 'flex';
                messagesWrapper.style.display = 'none';
            }
        }

        // 添加消息到界面；meta.time 为服务端历史时间（ISO 字符串等）
        function addMessage(role, content, isStreaming = false, messageType = 'text', meta = {}) {
            hideWelcomeScreen();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            // 根据消息类型渲染内容
            if (messageType === 'html') {
                bubble.classList.add('html-embed');
                bubble.innerHTML = content;
            } else if (messageType === 'plain') {
                bubble.textContent = content;
            } else if (role === 'ai') {
                renderMarkdownToBubble(bubble, content);
            } else {
                // 用户消息纯文本
                bubble.textContent = content;
            }
            
            const time = document.createElement('div');
            time.className = 'message-time';
            if (meta.time != null && meta.time !== '') {
                const ft = formatMessageTime(meta.time);
                time.textContent = ft || new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else {
                time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            
            contentWrapper.appendChild(bubble);
            contentWrapper.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentWrapper);
            
            messagesWrapper.appendChild(messageDiv);
            
            // 保存消息
            messages.push({ role, content, element: messageDiv, type: messageType, time: meta.time });
            
            // 滚动到底部
            scrollToBottom();
            
            return { bubble, time, messageDiv };
        }

        /** 流式正文写入合并气泡内的 .combined-answer-root，返回该节点 */
        function ensureMainStreamBubble() {
            const ctx = getOrCreateCombinedMessage();
            return ctx.mainEl;
        }

        // 显示打字指示器
        function showTypingIndicator() {
            hideWelcomeScreen();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(typingDiv);
            messagesWrapper.appendChild(messageDiv);
            
            scrollToBottom();
        }

        // 移除打字指示器
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 发送快速消息
        function sendQuickMessage(text) {
            messageInput.value = text;
            sendMessage();
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message || isStreaming) return;

            resetStreamTurnState();

            // 禁用输入
            isStreaming = true;
            sendButton.disabled = true;
            messageInput.disabled = true;

            // 添加用户消息
            addMessage('user', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 显示打字指示器
            showTypingIndicator();

            try {
                // 发送请求到后端
                const response = await authFetch('/api/chat/stream', {
                    method: 'POST',
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        message: message
                    })
                });

                if (!response.ok) {
                    throw new Error('网络响应错误');
                }

                // 移除打字指示器
                removeTypingIndicator();

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let sseBuffer = '';
                let streamCharBubble = null;
                let streamCharAccum = '';
                let mdThrottle = null;

                function finalizeStreamText(removeStreamingClass) {
                    if (mdThrottle) {
                        clearTimeout(mdThrottle);
                        mdThrottle = null;
                    }
                    if (streamCharBubble && streamCharAccum !== '') {
                        renderMarkdownToBubble(streamCharBubble, streamCharAccum);
                    }
                    if (removeStreamingClass && streamCharBubble) {
                        streamCharBubble.classList.remove('streaming');
                        const combined = streamCharBubble.closest('.combined-ai-bubble');
                        if (combined) {
                            combined.classList.remove('streaming');
                        }
                    }
                }

                function closeTextSegment() {
                    finalizeStreamText(true);
                    streamCharBubble = null;
                    streamCharAccum = '';
                }

                function scheduleMarkdownRefresh() {
                    if (mdThrottle) return;
                    mdThrottle = setTimeout(() => {
                        mdThrottle = null;
                        if (streamCharBubble) {
                            renderMarkdownToBubble(streamCharBubble, streamCharAccum);
                            scrollToBottom();
                        }
                    }, 100);
                }

                function handleStreamPayload(data) {
                    if (data === '' || data === '[DONE]') return;

                    if (data.startsWith('Error:')) {
                        closeTextSegment();
                        const { bubble } = addMessage('ai', data, false, 'plain');
                        bubble.classList.add('stream-error');
                        return;
                    }

                    if (tryParseToolCallPayload(data)) {
                        closeTextSegment();
                        appendToolCallJsonToAux(data);
                        return;
                    }

                    const trimmed = data.trimStart();
                    if (trimmed.startsWith('正在使用 ') && trimmed.includes('工具')) {
                        appendAuxMutedLine(data.trim());
                        return;
                    }
                    if (trimmed.startsWith('工具执行结果:')) {
                        const i = data.indexOf('工具执行结果:');
                        const body = data.slice(i + '工具执行结果:'.length).trim();
                        appendToolResultToAuxPanel(body);
                        return;
                    }

                    streamCharAccum += data;
                    if (!streamCharBubble) {
                        streamCharBubble = ensureMainStreamBubble();
                    }
                    scheduleMarkdownRefresh();
                }

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    sseBuffer += decoder.decode(value, { stream: true });
                    const parsed = consumeSSEBuffer(sseBuffer);
                    sseBuffer = parsed.rest;
                    for (const ev of parsed.events) {
                        handleStreamPayload(ev);
                    }
                }

                if (sseBuffer.trim()) {
                    const { events } = consumeSSEBuffer(sseBuffer + '\n\n');
                    for (const ev of events) {
                        handleStreamPayload(ev);
                    }
                }

                finalizeStreamText(true);
                finalizeStreamAuxPanel();

                refreshSidebarHistory();

            } catch (error) {
                console.error('发送消息错误:', error);
                removeTypingIndicator();
                finalizeStreamAuxPanel();
                const { bubble } = addMessage('ai', `抱歉，发生错误：${error.message}`, false, 'plain');
                bubble.classList.add('stream-error');
            } finally {
                // 恢复输入
                isStreaming = false;
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        // 创建新会话
        function createNewSession() {
            currentSessionId = generateSessionId();
            messages = [];
            messagesWrapper.innerHTML = '';
            showWelcomeScreen();
            refreshSidebarHistory();
            showNotification('已创建新会话');
        }

        function selectSessionFromHistory(sessionId) {
            if (!sessionId) return;
            currentSessionId = sessionId;
            loadSessionHistory(currentSessionId);
            refreshSidebarHistory();
            closeSidebar();
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 24px;
                background: rgba(0, 0, 0, 0.8);
                color: white;
                border-radius: 8px;
                font-size: 14px;
                z-index: 10000;
                animation: fadeInOut 2s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 2000);
        }

        // 侧边栏：加载会话列表并高亮当前会话
        function refreshSidebarHistory() {
            authFetch('/api/sessions')
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    const ids = data.sessions || [];
                    sidebarHistoryListEl.innerHTML = '';
                    if (ids.length === 0) {
                        const empty = document.createElement('div');
                        empty.className = 'sidebar-empty';
                        empty.textContent = '暂无历史会话，发一条消息开始吧';
                        sidebarHistoryListEl.appendChild(empty);
                        return;
                    }
                    ids.forEach(sessionId => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className = 'sidebar-item' + (sessionId === currentSessionId ? ' active' : '');
                        const label = sessionId.length > 36 ? sessionId.substring(0, 36) + '…' : sessionId;
                        btn.textContent = label;
                        btn.title = sessionId;
                        btn.addEventListener('click', () => selectSessionFromHistory(sessionId));
                        sidebarHistoryListEl.appendChild(btn);
                    });
                })
                .catch(error => {
                    console.error('加载会话列表错误:', error);
                });
        }

        /** 从服务端拉取 short_term 并渲染（与流式协议无关，仅展示 user / assistant 文本） */
        async function loadSessionHistory(sessionId) {
            if (!sessionId || sessionId === 'new') return;
            try {
                const res = await authFetch('/api/sessions/' + encodeURIComponent(sessionId));
                if (res.status === 404) {
                    throw new Error('会话不存在或已过期');
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                messages = [];
                messagesWrapper.innerHTML = '';
                const list = data.short_term || [];
                if (list.length === 0) {
                    showWelcomeScreen();
                    return;
                }
                for (const m of list) {
                    const role = m.role === 'user' ? 'user' : 'ai';
                    addMessage(role, m.content || '', false, 'text', { time: m.time });
                }
                hideWelcomeScreen();
                scrollToBottom();
            } catch (err) {
                messages = [];
                messagesWrapper.innerHTML = '';
                showWelcomeScreen();
                showNotification('加载会话失败：' + (err && err.message ? err.message : '未知错误'));
            }
        }

        document.getElementById('sidebarToggle').addEventListener('click', openSidebar);
        document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
        sidebarBackdropEl.addEventListener('click', closeSidebar);
        document.getElementById('sidebarNewChat').addEventListener('click', function() {
            createNewSession();
            closeSidebar();
        });

        document.getElementById('userAvatarBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            toggleUserDropdown();
        });
        document.getElementById('logoutBtn').addEventListener('click', function(e) {
            e.stopPropagation();
            logout();
        });
        document.addEventListener('click', function() {
            closeUserDropdown();
        });
        document.getElementById('userMenu').addEventListener('click', function(e) {
            e.stopPropagation();
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeSidebar();
                closeUserDropdown();
            }
        });

        // 添加淡入淡出动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInOut {
                0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
                10% { opacity: 1; transform: translateX(-50%) translateY(0); }
                90% { opacity: 1; transform: translateX(-50%) translateY(0); }
                100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            }
        `;
        document.head.appendChild(style);

        // 初始化（须先通过 bootstrapAuth，否则已跳转登录页）
        window.onload = async function() {
            const ok = await bootstrapAuth();
            if (!ok) return;
            configureMarked();
            messageInput.focus();
            showNotification('欢迎使用 Circle');
        };
    </script>
</body>
</html>
