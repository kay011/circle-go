<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#e8f4f2">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>登录 · Circle</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="fas fa-comments"></i>
            </div>
            <span>Circle</span>
        </div>
        <h1 class="auth-page-title">登录</h1>
        <div id="authBanner" class="auth-banner" hidden>注册成功，请登录</div>
        <form id="loginForm">
            <div class="auth-field">
                <label for="loginUsername">用户名</label>
                <input id="loginUsername" name="username" required autocomplete="username" placeholder="用户名" />
            </div>
            <div class="auth-field">
                <label for="loginPassword">密码</label>
                <input id="loginPassword" name="password" type="password" required autocomplete="current-password" placeholder="密码" />
            </div>
            <button type="submit" class="auth-submit" id="loginSubmit">登录</button>
        </form>
        <p class="auth-footer">没有账号？<a href="register.html" class="auth-link-inline">去注册</a></p>
    </div>
    <script src="auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async function () {
            var params = new URLSearchParams(window.location.search);
            if (params.get('registered') === '1') {
                var b = document.getElementById('authBanner');
                b.hidden = false;
            }

            var t = Auth.getToken();
            if (t) {
                try {
                    var res = await fetch('/api/auth/me', {
                        headers: { Authorization: 'Bearer ' + t }
                    });
                    if (res.ok) {
                        window.location.replace('index.html');
                        return;
                    }
                } catch (e) { /* 继续展示登录 */ }
                Auth.clearAuth();
            }

            document.getElementById('loginForm').addEventListener('submit', async function (e) {
                e.preventDefault();
                var btn = document.getElementById('loginSubmit');
                var u = document.getElementById('loginUsername').value.trim();
                var p = document.getElementById('loginPassword').value;
                btn.disabled = true;
                try {
                    var res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: u, password: p })
                    });
                    var text = await res.text();
                    var data;
                    try {
                        data = JSON.parse(text);
                    } catch (err) {
                        throw new Error(text || '登录失败');
                    }
                    if (!res.ok) {
                        throw new Error((data && data.message) || text || '登录失败');
                    }
                    Auth.setAuth(data.token, data.username || u);
                    window.location.replace('index.html');
                } catch (err) {
                    alert(err.message || '登录失败');
                } finally {
                    btn.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
