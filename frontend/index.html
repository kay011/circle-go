<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Chat</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Markdown 渲染和代码高亮 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #eef2ff;
            --chat-bg: #FFFFFF;
            --user-msg-bg: linear-gradient(135deg, #4f46e5, #6366f1);
            --ai-msg-bg: #f8fafc;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
            --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(circle at 15% 20%, #e0e7ff 0%, #eef2ff 35%, #f8fafc 100%);
            height: 100vh;
            overflow: hidden;
            color: var(--text-primary);
        }

        .app-container {
            max-width: 980px;
            margin: 14px auto;
            height: calc(100vh - 28px);
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            box-shadow: var(--shadow);
            border: 1px solid rgba(148, 163, 184, 0.22);
            border-radius: 18px;
            overflow: hidden;
        }

        /* 头部样式 */
        .header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #4338ca, #6366f1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .header-actions {
            display: flex;
            gap: 8px;
        }

        .btn-icon {
            width: 36px;
            height: 36px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s;
        }

        .btn-icon:hover {
            background: var(--bg-color);
            color: var(--primary-color);
        }

        /* 会话选择器 */
        .session-bar {
            padding: 12px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 12px;
            background: #FAFBFC;
        }

        .session-select {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            outline: none;
        }

        .session-select:focus {
            border-color: var(--primary-color);
        }

        .btn-new-session {
            padding: 8px 16px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-new-session:hover {
            background: var(--primary-hover);
        }

        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px;
            scroll-behavior: smooth;
            background: linear-gradient(180deg, #ffffff 0%, #f8fafc 100%);
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background: #D0D0D0;
            border-radius: 3px;
        }

        .chat-container::-webkit-scrollbar-thumb:hover {
            background: #B0B0B0;
        }

        .messages-wrapper {
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        /* 消息样式 */
        .message {
            display: flex;
            gap: 12px;
            animation: messageSlideIn 0.3s ease-out;
        }

        @keyframes messageSlideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;
        }

        .message.ai .message-avatar {
            background: linear-gradient(135deg, var(--primary-color), #7EA8FF);
            color: white;
        }

        .message.user .message-avatar {
            background: #E8E8E8;
            color: var(--text-secondary);
        }

        .message-content-wrapper {
            max-width: 70%;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .message.user .message-content-wrapper {
            align-items: flex-end;
        }

        .message-bubble {
            padding: 11px 14px;
            border-radius: 14px;
            line-height: 1.55;
            word-wrap: break-word;
            white-space: pre-wrap;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
            border: 1px solid transparent;
        }

        .message.ai .message-bubble {
            background: var(--ai-msg-bg);
            color: var(--text-primary);
            border-top-left-radius: 6px;
            border-color: #e2e8f0;
        }

        .message.user .message-bubble {
            background: var(--user-msg-bg);
            color: white;
            border-top-right-radius: 6px;
        }

        /* Markdown 样式 */
        .message-bubble.markdown-content {
            white-space: normal;
        }

        .message-bubble.markdown-content p {
            margin: 8px 0;
        }

        .message-bubble.markdown-content p:first-child {
            margin-top: 0;
        }

        .message-bubble.markdown-content p:last-child {
            margin-bottom: 0;
        }

        .message-bubble.markdown-content code {
            background: rgba(0, 0, 0, 0.06);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
        }

        .message.user .message-bubble.markdown-content code {
            background: rgba(255, 255, 255, 0.2);
        }

        .message-bubble.markdown-content pre {
            background: #1e1e1e;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 12px 0;
        }

        .message-bubble.markdown-content pre code {
            background: transparent;
            padding: 0;
            color: #d4d4d4;
        }

        .message-bubble.markdown-content ul,
        .message-bubble.markdown-content ol {
            margin: 8px 0;
            padding-left: 24px;
        }

        .message-bubble.markdown-content li {
            margin: 4px 0;
        }

        .message-bubble.markdown-content blockquote {
            border-left: 4px solid var(--primary-color);
            padding-left: 12px;
            margin: 8px 0;
            color: var(--text-secondary);
        }

        .message-bubble.markdown-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 12px 0;
        }

        .message-bubble.markdown-content th,
        .message-bubble.markdown-content td {
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            text-align: left;
        }

        .message-bubble.markdown-content th {
            background: rgba(0, 0, 0, 0.05);
            font-weight: 600;
        }

        /* 统一消息容器：思考过程、工具调用和回答都在一个气泡内 */
        .message-bubble.unified-message {
            padding: 0;
            background: transparent;
        }

        .unified-message-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .mini-status-line {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 2px;
            max-width: 100%;
        }

        .mini-status-item {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #334155;
            background: #ffffff;
            border: 1px solid #dbe3ee;
            border-radius: 999px;
            padding: 2px 8px;
            white-space: nowrap;
        }

        .mini-status-item .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #94a3b8;
            flex-shrink: 0;
        }

        .mini-status-item.thinking .dot { background: #6366f1; }
        .mini-status-item.approval .dot { background: #f59e0b; }
        .mini-status-item.tool .dot { background: #10b981; }
        .mini-status-item.skill .dot { background: #8b5cf6; }
        .mini-status-item.done .dot { background: #16a34a; }
        .mini-status-item.error .dot { background: #ef4444; }

        /* 流式阶段：仅一条轻量状态（不展示内部推理与工具细节） */
        .ai-thinking-chip {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 7px 12px;
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.035);
            border: 1px solid var(--border-color);
            font-size: 13px;
            color: var(--text-secondary);
        }

        .ai-thinking-chip-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary-color);
            flex-shrink: 0;
            animation: aiThinkingPulse 1.2s ease-in-out infinite;
        }

        @keyframes aiThinkingPulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1); }
        }

        .ai-thinking-chip-title {
            font-weight: 500;
            color: var(--text-primary);
            letter-spacing: 0.02em;
        }

        /* 思考过程 - 可折叠 */
        .thinking-process {
            border: 1px solid #d9d9d9;
            border-radius: 8px;
            background: #fafafa;
            overflow: hidden;
        }

        .thinking-process > summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 14px;
            font-size: 13px;
            color: #666;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .thinking-process > summary:hover {
            background: #f0f0f0;
        }

        .thinking-process > summary::-webkit-details-marker {
            display: none;
        }

        .thinking-process > summary i {
            color: #5B8FF9;
        }

        .thinking-content {
            padding: 12px 14px;
            font-size: 13px;
            line-height: 1.6;
            color: #666;
            border-top: 1px solid #e8e8e8;
            white-space: pre-wrap;
            word-break: break-word;
        }

        /* 工具调用：可折叠 */
        .tool-call-collapsible {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fafbfc;
            overflow: hidden;
            margin: 4px 0;
        }

        .skill-call-collapsible {
            border: 1px solid #ddd6fe;
            border-radius: 12px;
            background: #faf8ff;
            overflow: hidden;
            margin: 4px 0;
        }

        .skill-call-collapsible > summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            color: var(--text-primary);
            user-select: none;
        }

        .skill-call-collapsible > summary::-webkit-details-marker {
            display: none;
        }

        .skill-call-summary-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .skill-call-summary-left i {
            color: #7c3aed;
        }

        .skill-call-body {
            padding: 0 14px 12px;
            border-top: 1px solid #ddd6fe;
            background: white;
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .tool-call-collapsible > summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 14px;
            color: var(--text-primary);
            user-select: none;
        }

        .tool-call-collapsible > summary::-webkit-details-marker {
            display: none;
        }

        .tool-call-summary-left {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
        }

        .tool-call-summary-left i {
            color: var(--primary-color);
        }

        .tool-call-chevron {
            flex-shrink: 0;
            color: var(--text-secondary);
            transition: transform 0.2s ease;
        }

        .tool-call-collapsible[open] .tool-call-chevron i {
            transform: rotate(180deg);
        }

        .tool-call-body {
            padding: 0 14px 12px;
            border-top: 1px solid var(--border-color);
            background: white;
        }

        .tool-call-args pre {
            margin: 10px 0 0;
            padding: 12px;
            border-radius: 8px;
            background: #f6f8fa;
            border: 1px solid #e8eaed;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: 220px;
            overflow: auto;
        }

        .tool-call-done {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .tool-call-done i {
            color: #52c41a;
            margin-right: 4px;
        }

        .tool-approval-card {
            border: 1px solid #c7d2fe;
            background: linear-gradient(180deg, #eef2ff 0%, #f8faff 100%);
            border-radius: 14px;
            padding: 14px;
            margin: 6px 0;
            box-shadow: 0 6px 18px rgba(79, 70, 229, 0.12);
        }

        .tool-approval-title {
            font-size: 14px;
            font-weight: 600;
            color: #312e81;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
        }

        .tool-approval-desc {
            font-size: 13px;
            color: #4338ca;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-break: break-word;
            background: rgba(79, 70, 229, 0.08);
            border: 1px solid rgba(79, 70, 229, 0.18);
            padding: 8px 10px;
            border-radius: 8px;
        }

        .tool-approval-args {
            margin: 0 0 10px;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            background: #eef3ff;
            border: 1px solid #dbe6ff;
            border-radius: 8px;
            padding: 10px;
            max-height: 180px;
            overflow: auto;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .tool-approval-actions {
            display: flex;
            gap: 8px;
        }

        .tool-approval-btn {
            border: none;
            border-radius: 8px;
            padding: 7px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tool-approval-btn.approve {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
        }

        .tool-approval-btn.reject {
            background: #fff;
            color: #be123c;
            border: 1px solid #fecdd3;
        }

        .tool-approval-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .tool-approval-status {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        /* 工具执行结果：可折叠 */
        .tool-result-collapsible {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            background: #fafbfc;
            overflow: hidden;
            margin: 4px 0;
        }

        .tool-result-collapsible > summary {
            list-style: none;
            cursor: pointer;
            padding: 10px 14px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .tool-result-collapsible > summary::-webkit-details-marker {
            display: none;
        }

        .tool-result-summary .hint {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
        }

        .stream-meta-msg .message-bubble {
            background: #EEF2FF;
            color: #4a5568;
            font-size: 13px;
            border-top-left-radius: 4px;
        }

        /* 最终回答区域 */
        .final-answer {
            padding: 10px 14px;
            background: var(--ai-msg-bg);
            border-radius: 12px;
            border-top-left-radius: 4px;
            border: 1px solid #e2e8f0;
        }

        .tool-result-snippet {
            margin: 0;
            padding: 12px 14px 14px;
            background: #1e1e1e;
            color: #d4d4d4;
            border-top: 1px solid var(--border-color);
            font-size: 12px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
            max-height: min(50vh, 360px);
            overflow-y: auto;
        }

        .message-bubble.stream-error {
            background: #FFF2F0;
            color: #CF1322;
            border: 1px solid #FFCCC7;
        }

        .message-bubble.streaming {
            border: 1px dashed var(--border-color);
        }

        .message-bubble.html-embed {
            white-space: normal;
        }

        .message-time {
            font-size: 11px;
            color: var(--text-secondary);
            padding: 0 4px;
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            background: var(--ai-msg-bg);
            border-radius: 12px;
            border-top-left-radius: 4px;
            width: fit-content;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            30% {
                transform: translateY(-10px);
                opacity: 1;
            }
        }

        /* 输入区域 */
        .input-area {
            padding: 16px 24px 24px;
            border-top: 1px solid var(--border-color);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
        }

        .model-picker {
            max-width: 138px;
            height: 28px;
            border: 1px solid #e8ebf3;
            border-radius: 10px;
            background: #f8fafd;
            color: #64748b;
            font-size: 11px;
            font-weight: 400;
            padding: 0 22px 0 8px;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            background-image: linear-gradient(45deg, transparent 50%, #64748b 50%), linear-gradient(135deg, #64748b 50%, transparent 50%);
            background-position: calc(100% - 11px) 11px, calc(100% - 7px) 11px;
            background-size: 4px 4px, 4px 4px;
            background-repeat: no-repeat;
            flex-shrink: 0;
            transition: all 0.2s ease;
        }

        .model-picker:hover {
            border-color: #d8deea;
            background: #f6f8fc;
            color: #475569;
        }

        .model-picker:focus {
            outline: none;
            border-color: var(--primary-color);
            background: #ffffff;
            color: #334155;
            box-shadow: 0 0 0 2px rgba(91, 143, 249, 0.08);
        }

        .input-box {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            padding: 12px 16px;
            background: #f8fafc;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            transition: all 0.2s;
            box-shadow: inset 0 1px 2px rgba(15, 23, 42, 0.04);
        }

        .input-box:focus-within {
            border-color: var(--primary-color);
            background: white;
            box-shadow: 0 0 0 3px rgba(91, 143, 249, 0.1);
        }

        .message-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 15px;
            line-height: 1.5;
            resize: none;
            outline: none;
            max-height: 120px;
            min-height: 24px;
            font-family: inherit;
        }

        .message-input::placeholder {
            color: #999;
        }

        .send-button {
            width: 36px;
            height: 36px;
            border: none;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white;
            border-radius: 11px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .send-button:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: scale(1.05);
        }

        .send-button:disabled {
            background: #D0D0D0;
            cursor: not-allowed;
        }

        .input-hint {
            text-align: center;
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 8px;
        }

        /* 欢迎界面 */
        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
        }

<body>

        <!-- 会话栏 -->
        <div class="session-bar">

            </select>
            <button class="btn-new-session" onclick="createNewSession()">
                <i class="fas fa-plus"></i>
                新建
            </button>
        </div>

        <!-- 聊天容器 -->
        <div class="chat-container" id="chatContainer">
            <!-- 欢迎界面 -->
            <div class="welcome-screen" id="welcomeScreen">
                <div class="welcome-logo">
                    <i class="fas fa-robot"></i>
                </div>
                <div class="welcome-title">你好，我是 AI Agent</div>
                <div class="welcome-subtitle">我可以帮你解答问题、执行任务、分析数据</div>
                <div class="quick-actions">
                    <button class="quick-action-btn" onclick="sendQuickMessage('帮我计算 256 * 128')">
                        <div class="quick-action-icon">🔢</div>
                        <div class="quick-action-text">数学计算</div>
                    </button>
                    <button class="quick-action-btn" onclick="sendQuickMessage('今天天气怎么样？')">
                        <div class="quick-action-icon">🌤️</div>
                        <div class="quick-action-text">查询天气</div>
                    </button>
                    <button class="quick-action-btn" onclick="sendQuickMessage('写一段 Python 代码')">

                    </button>
                    <button class="quick-action-btn" onclick="sendQuickMessage('请调用 hello_world 工具，name=Circle')">

                    </button>
                    <button class="quick-action-btn" onclick="sendQuickMessage('请务必调用 investment_analyzer 工具，asset_type=stock，分析 600519 是否具备投资价值，并输出PE和评分明细')">
                        <div class="quick-action-icon">📈</div>
                        <div class="quick-action-text">股票分析</div>
                    </button>
                    <button class="quick-action-btn" onclick="sendQuickMessage('请务必调用 fund_compare 工具，对比 161725, 易方达蓝筹精选, 景顺长城新兴成长，并输出成立时间、1Y/3Y/5Y收益、夏普、最大回撤、规模、类型和综合评分')">
                        <div class="quick-action-icon">🆚</div>
                        <div class="quick-action-text">基金对比</div>
                    </button>
                </div>
            </div>

            <!-- 消息列表 -->
            <div class="messages-wrapper" id="messagesWrapper" style="display: none;"></div>
        </div>

        <!-- 输入区域 -->
        <div class="input-area">
            <div class="input-wrapper">
                <div class="input-box">
                    <select id="llmModelPicker" class="model-picker" title="切换模型">
                        <option value="default::">模型加载中...</option>
                    </select>
                    <textarea 
                        id="messageInput" 
                        class="message-input" 
                        placeholder="输入消息... (Enter 发送，Shift+Enter 换行)"
                        rows="1"
                        onkeydown="handleKeyDown(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <button class="send-button" id="sendButton" onclick="sendMessage()">
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>
                <div class="input-hint">AI 生成的内容可能不准确，请谨慎使用</div>
            </div>
        </div>
    </div>

    <script>
        let currentSessionId = generateSessionId();
        let isStreaming = false;
        let messages = []; // 存储所有消息
        const pendingToolApprovals = new Map();
        const chatContainer = document.getElementById('chatContainer');
        const messagesWrapper = document.getElementById('messagesWrapper');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const messageInput = document.getElementById('messageInput');
        const llmModelPicker = document.getElementById('llmModelPicker');
        const sendButton = document.getElementById('sendButton');
        let llmCatalog = { default_provider: 'default', providers: [] };

        function normalizeProviderLabel(name) {
            if (name === 'qwen') return 'Qwen';
            if (name === 'deepseek') return 'DeepSeek';
            if (name === 'default') return '默认';
            return name;
        }

        function rebuildModelPicker() {
            llmModelPicker.innerHTML = '';
            let selectedValue = '';

            (llmCatalog.providers || []).forEach(p => {
                const providerName = p.name || 'default';
                const providerLabel = normalizeProviderLabel(providerName);
                const models = (p.models && p.models.length > 0) ? p.models : [p.default_model];
                models.filter(Boolean).forEach(m => {
                    const opt = document.createElement('option');
                    opt.value = `${providerName}::${m}`;
                    opt.textContent = m;
                    llmModelPicker.appendChild(opt);
                    if (!selectedValue && providerName === llmCatalog.default_provider && m === p.default_model) {
                        selectedValue = opt.value;
                    }
                });
            });

            if (llmModelPicker.options.length === 0) {
                const opt = document.createElement('option');
                opt.value = 'default::';
                opt.textContent = '默认模型';
                llmModelPicker.appendChild(opt);
            }
            llmModelPicker.value = selectedValue || llmModelPicker.options[0].value;
        }

        async function loadLLMModels() {
            try {
                const resp = await fetch('/api/llm/models');
                if (!resp.ok) throw new Error('load failed');
                const data = await resp.json();
                llmCatalog = data || llmCatalog;
                rebuildModelPicker();
            } catch (_) {
                llmModelPicker.innerHTML = '<option value="default::">默认模型</option>';
            }
        }

        function buildLLMPayload() {
            const selected = (llmModelPicker?.value || '').trim();
            if (!selected) {
                return undefined;
            }
            const [providerRaw, modelRaw] = selected.split('::');
            const provider = (providerRaw || 'default').trim();
            const model = (modelRaw || '').trim();
            if (model === '') return undefined;
            return {
                provider,
                model
            };
        }

        // 生成会话ID
        function generateSessionId() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        // 自动调整输入框高度
        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        // 处理键盘事件
        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        loadLLMModels();

        let scrollScheduled = false;
        function scrollToBottom() {
            if (scrollScheduled) return;
            scrollScheduled = true;
            requestAnimationFrame(() => {
                scrollScheduled = false;
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });
        }

        function escapeHtml(s) {
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        function formatMessageTime(ts) {
            if (ts == null || ts === '') return '';
            try {
                const d = typeof ts === 'string' || typeof ts === 'number' ? new Date(ts) : ts;
                if (isNaN(d.getTime())) return '';
                return d.toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
            } catch (_) {
                return '';
            }
        }

        function highlightCodeIn(bubble) {
            if (!bubble || typeof hljs === 'undefined') return;
            bubble.querySelectorAll('pre code').forEach((block) => {
                try {
                    hljs.highlightElement(block);
                } catch (_) { /* 流式阶段可能不完整 */ }
            });
        }

        function configureMarked() {
            if (typeof marked === 'undefined') return;
            if (typeof marked.use === 'function') {
                try {
                    marked.use({ breaks: true });
                } catch (_) {
                    if (typeof marked.setOptions === 'function') {
                        marked.setOptions({ breaks: true });
                    }
                }
            } else if (typeof marked.setOptions === 'function') {
                marked.setOptions({ breaks: true });
            }
        }

        function renderMarkdownToBubble(bubble, text) {
            if (!bubble) return;
            bubble.classList.add('markdown-content');
            try {
                if (typeof marked !== 'undefined') {
                    bubble.innerHTML = marked.parse(text || '');
                } else {
                    bubble.textContent = text || '';
                }
            } catch (e) {
                bubble.textContent = text || '';
            }
            highlightCodeIn(bubble);
        }

        /** 按 SSE 规范用 \n\n 分隔事件，拼接同事件内多行 data: */
        function consumeSSEBuffer(buffer) {
            const events = [];
            let rest = buffer;
            let idx;
            while ((idx = rest.indexOf('\n\n')) !== -1) {
                const raw = rest.slice(0, idx);
                rest = rest.slice(idx + 2);
                const lines = raw.split('\n');
                const parts = [];
                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        const payload = line.startsWith('data: ') ? line.slice(6) : line.slice(5).replace(/^\s/, '');
                        parts.push(payload);
                    }
                }
                if (parts.length) {
                    events.push(parts.join('\n'));
                }
            }
            return { events, rest };
        }

        function tryParseToolCallPayload(data) {
            const t = data.trim();
            if (!t.startsWith('{') || t.indexOf('tool_call') === -1) return null;
            try {
                const o = JSON.parse(t);
                if (o && o.tool_call && typeof o.tool_call === 'object') return o;
            } catch (_) { /* 非 JSON */ }
            return null;
        }

        function tryParseErrorPayload(data) {
            const t = (data || '').trim();
            if (!t.startsWith('{') || t.indexOf('"error"') === -1) return null;
            try {
                const o = JSON.parse(t);
                if (o && o.error && typeof o.error === 'object' && o.error.code) return o.error;
            } catch (_) {}
            return null;
        }

        // 隐藏欢迎界面
        function hideWelcomeScreen() {
            welcomeScreen.style.display = 'none';
            messagesWrapper.style.display = 'flex';
        }

        // 显示欢迎界面
        function showWelcomeScreen() {
            if (messages.length === 0) {
                welcomeScreen.style.display = 'flex';
                messagesWrapper.style.display = 'none';
            }
        }

        // 添加消息到界面；meta.time 为服务端历史时间（ISO 字符串等）
        function addMessage(role, content, isStreaming = false, messageType = 'text', meta = {}) {
            hideWelcomeScreen();

            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = role === 'user' ? '<i class="fas fa-user"></i>' : '<i class="fas fa-robot"></i>';
            
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            
            // 根据消息类型渲染内容
            if (messageType === 'tool-call') {
                bubble.classList.add('html-embed');
                bubble.innerHTML = renderToolCall(content);
            } else if (messageType === 'html') {
                bubble.classList.add('html-embed');
                bubble.innerHTML = content;
            } else if (messageType === 'plain') {
                bubble.textContent = content;
            } else if (role === 'ai') {
                renderMarkdownToBubble(bubble, content);
            } else {
                // 用户消息纯文本
                bubble.textContent = content;
            }
            
            const time = document.createElement('div');
            time.className = 'message-time';
            if (meta.time != null && meta.time !== '') {
                const ft = formatMessageTime(meta.time);
                time.textContent = ft || new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            } else {
                time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            }
            
            contentWrapper.appendChild(bubble);
            contentWrapper.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentWrapper);
            
            messagesWrapper.appendChild(messageDiv);
            
            // 保存消息
            messages.push({ role, content, element: messageDiv, type: messageType, time: meta.time });
            
            // 滚动到底部
            scrollToBottom();
            
            return { bubble, time, messageDiv };
        }

        // 渲染工具调用：可折叠，默认收起
        function renderToolCall(toolData) {
            try {
                const data = typeof toolData === 'string' ? JSON.parse(toolData) : toolData;
                const toolCall = data.tool_call;
                const name = escapeHtml(toolCall.name || '');
                const args = escapeHtml(JSON.stringify(toolCall.arguments, null, 2));
                
                return `
                    <details class="tool-call-collapsible">
                        <summary class="tool-call-summary">
                            <span class="tool-call-summary-left">
                                <i class="fas fa-screwdriver-wrench"></i>
                                <span>工具 <strong>${name}</strong></span>
                            </span>
                            <span class="tool-call-chevron"><i class="fas fa-chevron-down"></i></span>
                        </summary>
                        <div class="tool-call-body">
                            <div class="tool-call-args"><pre>${args}</pre></div>
                        </div>
                    </details>
                `;
            } catch (e) {
                return '<details class="tool-call-collapsible"><summary>工具调用</summary><div class="tool-call-body">解析失败</div></details>';
            }
        }

        // 创建统一消息容器（思考/工具阶段仅展示轻量「Exploring」条，不展示内部细节）
        let currentUnifiedBubble = null;
        let currentUnifiedContainer = null;
        let thinkingChipEl = null;
        let answerSection = null;
        let statusLine = null;
        let recentStatusKeys = [];

        function ensureStatusLine() {
            if (!currentUnifiedContainer) {
                createUnifiedMessage();
            }
            if (statusLine && statusLine.isConnected) {
                return statusLine;
            }
            const line = document.createElement('div');
            line.className = 'mini-status-line';
            statusLine = line;
            if (answerSection && currentUnifiedContainer.contains(answerSection)) {
                currentUnifiedContainer.insertBefore(line, answerSection);
            } else {
                currentUnifiedContainer.appendChild(line);
            }
            return line;
        }

        function addTimelineEvent(type, text) {
            ensureStatusLine();
            if (!statusLine) return;
            const key = `${type}:${text}`;
            if (recentStatusKeys.includes(key)) return;
            recentStatusKeys.push(key);
            if (recentStatusKeys.length > 6) {
                recentStatusKeys.shift();
            }
            const item = document.createElement('div');
            item.className = `mini-status-item ${type}`;
            item.innerHTML = `<span class="dot"></span><span>${escapeHtml(text)}</span>`;
            statusLine.appendChild(item);
            while (statusLine.children.length > 3) {
                statusLine.removeChild(statusLine.firstChild);
            }
            scrollToBottom();
        }

        function dismissThinkingChip() {
            if (thinkingChipEl && thinkingChipEl.parentNode) {
                thinkingChipEl.remove();
            }
            thinkingChipEl = null;
        }

        /** 在最终回答上方显示一条「Exploring」状态（无展开内容、不展示工具与原始状态文案） */
        function ensureThinkingChip() {
            if (!currentUnifiedContainer) {
                createUnifiedMessage();
            }
            if (thinkingChipEl && thinkingChipEl.isConnected) {
                return thinkingChipEl;
            }
            const chip = document.createElement('div');
            chip.className = 'ai-thinking-chip';
            chip.setAttribute('role', 'status');
            chip.setAttribute('aria-live', 'polite');
            chip.innerHTML = `
                <span class="ai-thinking-chip-dot" aria-hidden="true"></span>
                <span class="ai-thinking-chip-title">Exploring</span>
            `;
            thinkingChipEl = chip;
            if (answerSection && currentUnifiedContainer.contains(answerSection)) {
                currentUnifiedContainer.insertBefore(chip, answerSection);
            } else {
                currentUnifiedContainer.appendChild(chip);
            }
            scrollToBottom();
            return chip;
        }

        function createUnifiedMessage() {
            hideWelcomeScreen();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble unified-message';
            
            const container = document.createElement('div');
            container.className = 'unified-message-container';
            bubble.appendChild(container);
            
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            
            contentWrapper.appendChild(bubble);
            contentWrapper.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentWrapper);
            messagesWrapper.appendChild(messageDiv);
            
            currentUnifiedBubble = bubble;
            currentUnifiedContainer = container;
            thinkingChipEl = null;
            answerSection = null;
            statusLine = null;
            recentStatusKeys = [];
            
            messages.push({ role: 'ai', content: '', element: messageDiv, type: 'unified' });
            scrollToBottom();
            
            return { bubble, container, messageDiv };
        }

        // 状态类 SSE：仅维持「Exploring」条，不向用户展示原始状态文案
        function addThinkingToUnified(_thinkingText) {
            ensureThinkingChip();
        }

        // 工具调用 JSON：不向用户展示参数等细节
        function addToolCallToUnified(toolData) {
            let data;
            try {
                data = typeof toolData === 'string' ? JSON.parse(toolData) : toolData;
            } catch (_) {
                return;
            }
            if (!data || !data.tool_call || typeof data.tool_call !== 'object') return;
            ensureThinkingChip();
            addTimelineEvent('approval', `等待审批：${data.tool_call.name || 'tool'}`);
            renderToolApprovalCard(data.tool_call);
        }

        // 工具执行结果：不向用户展示原始输出
        function addToolResultToUnified(_resultText) {
            ensureThinkingChip();
            addTimelineEvent('tool', '工具执行完成');
        }

        function renderSkillCallCard(skillName) {
            const safe = escapeHtml((skillName || '').trim() || 'unknown');
            return `
                <details class="skill-call-collapsible">
                    <summary>
                        <span class="skill-call-summary-left">
                            <i class="fas fa-wand-magic-sparkles"></i>
                            <span>Skill <strong>${safe}</strong></span>
                        </span>
                        <span class="tool-call-chevron"><i class="fas fa-chevron-down"></i></span>
                    </summary>
                    <div class="skill-call-body">
                        当前轮次已命中该 Skill，后续将基于此 Skill 的约束与工具元数据继续执行。
                    </div>
                </details>
            `;
        }

        function addSkillToUnified(skillName) {
            ensureThinkingChip();
            const name = (skillName || '').trim() || 'unknown';
            addTimelineEvent('skill', `调用 Skill：${name}`);
            const skillWrapper = document.createElement('div');
            skillWrapper.className = 'message-bubble html-embed';
            skillWrapper.innerHTML = renderSkillCallCard(name);
            if (answerSection && currentUnifiedContainer.contains(answerSection)) {
                currentUnifiedContainer.insertBefore(skillWrapper, answerSection);
            } else {
                currentUnifiedContainer.appendChild(skillWrapper);
            }
            scrollToBottom();
        }

        // 获取或创建回答区域
        function getOrCreateAnswerSection() {
            if (!currentUnifiedContainer) {
                createUnifiedMessage();
            }
            
            if (!answerSection) {
                answerSection = document.createElement('div');
                answerSection.className = 'final-answer markdown-content streaming';
                currentUnifiedContainer.appendChild(answerSection);
            }
            
            return answerSection;
        }

        function renderToolApprovalCard(toolCall) {
            if (!toolCall || !toolCall.id) return;
            if (pendingToolApprovals.has(toolCall.id)) return;
            if (!currentUnifiedContainer) createUnifiedMessage();
            pendingToolApprovals.set(toolCall.id, 'pending');

            const card = document.createElement('div');
            card.className = 'tool-approval-card';
            card.dataset.toolCallId = toolCall.id;

            const safeName = escapeHtml(toolCall.name || 'unknown');
            const safeReason = escapeHtml(toolCall.reasoning || '模型请求调用工具以继续完成任务');
            const safeArgs = escapeHtml(JSON.stringify(toolCall.arguments || {}, null, 2));

            card.innerHTML = `
                <div class="tool-approval-title">
                    <i class="fas fa-shield-alt"></i>
                    <span>工具调用审批：${safeName}</span>
                </div>
                <div class="tool-approval-desc">${safeReason}</div>
                <pre class="tool-approval-args">${safeArgs}</pre>
                <div class="tool-approval-actions">
                    <button class="tool-approval-btn approve">批准执行</button>
                    <button class="tool-approval-btn reject">拒绝</button>
                </div>
                <div class="tool-approval-status">等待你的操作...</div>
            `;

            const approveBtn = card.querySelector('.tool-approval-btn.approve');
            const rejectBtn = card.querySelector('.tool-approval-btn.reject');
            const statusEl = card.querySelector('.tool-approval-status');

            async function submitApproval(approved) {
                approveBtn.disabled = true;
                rejectBtn.disabled = true;
                statusEl.textContent = approved ? '正在提交批准...' : '正在提交拒绝...';
                try {
                    const resp = await fetch('/api/chat/toolcall', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            session_id: currentSessionId,
                            tool_call_id: toolCall.id,
                            approval_token: toolCall.approval_token,
                            approved
                        })
                    });
                    if (!resp.ok) {
                        const errText = await resp.text();
                        throw new Error(errText || ('HTTP ' + resp.status));
                    }
                    statusEl.textContent = approved ? '已批准，等待工具执行结果...' : '已拒绝，等待模型继续响应...';
                    pendingToolApprovals.set(toolCall.id, approved ? 'approved' : 'rejected');
                    addTimelineEvent(approved ? 'tool' : 'done', approved ? `已批准：${toolCall.name || 'tool'}` : `已拒绝：${toolCall.name || 'tool'}`);
                } catch (e) {
                    statusEl.textContent = '审批提交失败，请重试';
                    approveBtn.disabled = false;
                    rejectBtn.disabled = false;
                    pendingToolApprovals.set(toolCall.id, 'pending');
                    addTimelineEvent('error', `审批失败：${toolCall.name || 'tool'}`);
                    console.error('tool approval failed:', e);
                }
            }

            approveBtn.addEventListener('click', () => submitApproval(true));
            rejectBtn.addEventListener('click', () => submitApproval(false));

            if (answerSection && currentUnifiedContainer.contains(answerSection)) {
                currentUnifiedContainer.insertBefore(card, answerSection);
            } else {
                currentUnifiedContainer.appendChild(card);
            }
            scrollToBottom();
        }

        // 完成流式输出
        function finalizeUnifiedMessage() {
            if (currentUnifiedBubble) {
                const answerEl = currentUnifiedBubble.querySelector('.final-answer');
                if (answerEl) {
                    answerEl.classList.remove('streaming');
                }
            }
            dismissThinkingChip();
            currentUnifiedBubble = null;
            currentUnifiedContainer = null;
            answerSection = null;
            statusLine = null;
            recentStatusKeys = [];
        }

        function appendStreamMetaLine(text) {
            hideWelcomeScreen();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai stream-meta-msg';
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = text;
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            contentWrapper.appendChild(bubble);
            contentWrapper.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentWrapper);
            messagesWrapper.appendChild(messageDiv);
            messages.push({ role: 'ai', content: text, element: messageDiv, type: 'stream-meta' });
            scrollToBottom();
        }

        function appendToolResultBlock(body) {
            const esc = escapeHtml(body);
            addMessage('ai', `
                <details class="tool-result-collapsible">
                    <summary class="tool-result-summary">
                        工具执行结果
                        <span class="hint">点击展开 / 收起</span>
                    </summary>
                    <pre class="tool-result-snippet">${esc}</pre>
                </details>
            `, false, 'html');
        }

        /** 创建用于流式正文的 AI 气泡，返回 bubble 节点 */
        function createStreamingAssistantBubble() {
            hideWelcomeScreen();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            const contentWrapper = document.createElement('div');
            contentWrapper.className = 'message-content-wrapper';
            const bubble = document.createElement('div');
            bubble.className = 'message-bubble markdown-content streaming';
            const time = document.createElement('div');
            time.className = 'message-time';
            time.textContent = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
            contentWrapper.appendChild(bubble);
            contentWrapper.appendChild(time);
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(contentWrapper);
            messagesWrapper.appendChild(messageDiv);
            messages.push({ role: 'ai', content: '', element: messageDiv, type: 'streaming' });
            scrollToBottom();
            return bubble;
        }

        // 显示打字指示器
        function showTypingIndicator() {
            hideWelcomeScreen();
            
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ai';
            messageDiv.id = 'typingIndicator';
            
            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.innerHTML = '<i class="fas fa-robot"></i>';
            
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            typingDiv.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            
            messageDiv.appendChild(avatar);
            messageDiv.appendChild(typingDiv);
            messagesWrapper.appendChild(messageDiv);
            
            scrollToBottom();
        }

        // 移除打字指示器
        function removeTypingIndicator() {
            const indicator = document.getElementById('typingIndicator');
            if (indicator) {
                indicator.remove();
            }
        }

        // 发送快速消息
        function sendQuickMessage(text) {
            messageInput.value = text;
            sendMessage();
        }

        // 发送消息
        async function sendMessage() {
            const message = messageInput.value.trim();
            
            if (!message || isStreaming) return;

            // 禁用输入
            isStreaming = true;
            sendButton.disabled = true;
            messageInput.disabled = true;

            // 添加用户消息
            addMessage('user', message);
            messageInput.value = '';
            messageInput.style.height = 'auto';

            // 显示打字指示器
            showTypingIndicator();

            try {
                // 发送请求到后端
                const response = await fetch('/api/chat/stream', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        session_id: currentSessionId,
                        message: message,
                        llm: buildLLMPayload()
                    })
                });

                if (!response.ok) {
                    let errPayload = null;
                    try {
                        errPayload = await response.json();
                    } catch (_) {}
                    if (errPayload && errPayload.error) {
                        const e = errPayload.error;
                        const retryHint = e.retryable ? '（可重试）' : '';
                        throw new Error(`[${e.code}] ${e.message}${retryHint}`);
                    }
                    throw new Error(`网络响应错误（HTTP ${response.status}）`);
                }

                // 移除打字指示器
                removeTypingIndicator();

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let sseBuffer = '';
                let streamCharBubble = null;
                let streamCharAccum = '';
                let mdThrottle = null;
                const FAST_RENDER_MS = 35;
                const NORMAL_RENDER_MS = 100;
                const TYPEWRITER_WINDOW_CHARS = 800;

                function finalizeStreamText(removeStreamingClass) {
                    if (mdThrottle) {
                        clearTimeout(mdThrottle);
                        mdThrottle = null;
                    }
                    if (streamCharBubble && streamCharAccum !== '') {
                        renderMarkdownToBubble(streamCharBubble, streamCharAccum);
                    }
                    if (removeStreamingClass && streamCharBubble) {
                        streamCharBubble.classList.remove('streaming');
                    }
                }

                function closeTextSegment() {
                    finalizeStreamText(true);
                    streamCharBubble = null;
                    streamCharAccum = '';
                }

                function scheduleMarkdownRefresh() {
                    if (mdThrottle) return;
                    const renderDelay = streamCharAccum.length <= TYPEWRITER_WINDOW_CHARS ? FAST_RENDER_MS : NORMAL_RENDER_MS;
                    mdThrottle = setTimeout(() => {
                        mdThrottle = null;
                        if (streamCharBubble) {
                            if (streamCharAccum.trim() !== '') {
                                dismissThinkingChip();
                            }
                            renderMarkdownToBubble(streamCharBubble, streamCharAccum);
                            scrollToBottom();
                        }
                    }, renderDelay);
                }

                function handleStreamPayload(data) {
                    if (data === '' || data === '[DONE]') return;

                    // 处理错误
                    if (data.startsWith('Error:')) {
                        closeTextSegment();
                        finalizeUnifiedMessage();
                        const { bubble } = addMessage('ai', data, false, 'plain');
                        bubble.classList.add('stream-error');
                        return;
                    }

                    const apiErr = tryParseErrorPayload(data);
                    if (apiErr) {
                        closeTextSegment();
                        finalizeUnifiedMessage();
                        const retryHint = apiErr.retryable ? '（可重试）' : '';
                        const msg = `请求失败 [${apiErr.code}]：${apiErr.message}${retryHint}`;
                        const { bubble } = addMessage('ai', msg, false, 'plain');
                        bubble.classList.add('stream-error');
                        return;
                    }

                    // 处理工具调用请求
                    if (tryParseToolCallPayload(data)) {
                        closeTextSegment();
                        addToolCallToUnified(data);
                        return;
                    }

                    const trimmed = data.trimStart();
                    
                    // 处理「正在使用工具」状态（后端 [STATUS] 前缀与纯文本两种）
                    if (trimmed.startsWith('[SKILL]')) {
                        closeTextSegment();
                        const skillName = trimmed.replace(/^\[SKILL\]\s*/, '').trim();
                        addSkillToUnified(skillName);
                        return;
                    }
                    if (trimmed.startsWith('[STATUS]')) {
                        closeTextSegment();
                        addThinkingToUnified(trimmed.replace(/^\[STATUS\]\s*/, '').trim());
                        return;
                    }
                    if (trimmed.startsWith('正在使用 ') && trimmed.includes('工具')) {
                        closeTextSegment();
                        addThinkingToUnified(data.trim());
                        return;
                    }
                    
                    // 工具执行结果（后端 [RESULT] 与旧版「工具执行结果:」）
                    if (trimmed.startsWith('[RESULT]')) {
                        closeTextSegment();
                        const body = trimmed.replace(/^\[RESULT\]\s*/, '').trim();
                        addToolResultToUnified(body);
                        return;
                    }
                    if (trimmed.startsWith('工具执行结果:')) {
                        closeTextSegment();
                        const i = data.indexOf('工具执行结果:');
                        const body = data.slice(i + '工具执行结果:'.length).trim();
                        addToolResultToUnified(body);
                        return;
                    }

                    // 普通文本内容 - 添加到回答区域
                    streamCharAccum += data;
                    if (!streamCharBubble) {
                        streamCharBubble = getOrCreateAnswerSection();
                    }
                    scheduleMarkdownRefresh();
                }

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    sseBuffer += decoder.decode(value, { stream: true });
                    const parsed = consumeSSEBuffer(sseBuffer);
                    sseBuffer = parsed.rest;
                    for (const ev of parsed.events) {
                        handleStreamPayload(ev);
                    }
                }

                if (sseBuffer.trim()) {
                    const { events } = consumeSSEBuffer(sseBuffer + '\n\n');
                    for (const ev of events) {
                        handleStreamPayload(ev);
                    }
                }

                finalizeStreamText(true);
                finalizeUnifiedMessage();

                loadSessions();

            } catch (error) {
                console.error('发送消息错误:', error);
                removeTypingIndicator();
                const { bubble } = addMessage('ai', `抱歉，发生错误：${error.message}`, false, 'plain');
                bubble.classList.add('stream-error');
            } finally {
                // 恢复输入
                isStreaming = false;
                sendButton.disabled = false;
                messageInput.disabled = false;
                messageInput.focus();
            }
        }

        // 创建新会话
        function createNewSession() {
            currentSessionId = generateSessionId();
            messages = [];
            pendingToolApprovals.clear();
            messagesWrapper.innerHTML = '';
            showWelcomeScreen();
            
            const now = new Date().toLocaleString('zh-CN');
            const sessionSelect = document.getElementById('sessionSelect');
            const option = document.createElement('option');
            option.value = currentSessionId;
            option.textContent = `会话 ${now}`;
            option.selected = true;
            sessionSelect.insertBefore(option, sessionSelect.firstChild.nextSibling);
            
            showNotification('已创建新会话');
        }

        // 清空聊天
        function clearChat() {
            if (confirm('确定要清空当前对话吗？')) {
                messages = [];
                pendingToolApprovals.clear();
                messagesWrapper.innerHTML = '';
                showWelcomeScreen();
                showNotification('已清空对话');
            }
        }

        // 切换设置
        function toggleSettings() {
            showNotification('设置功能开发中...');
        }

        // 显示通知
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 12px 24px;
                background: rgba(0, 0, 0, 0.8);
                color: white;
                border-radius: 8px;
                font-size: 14px;
                z-index: 10000;
                animation: fadeInOut 2s ease;
            `;
            notification.textContent = message;
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 2000);
        }

        // 加载会话列表（保留当前选中项）
        function loadSessions() {
            fetch('/api/sessions')
                .then(response => {
                    if (!response.ok) throw new Error('HTTP ' + response.status);
                    return response.json();
                })
                .then(data => {
                    const sessionSelect = document.getElementById('sessionSelect');
                    const firstOption = sessionSelect.firstChild;
                    sessionSelect.innerHTML = '';
                    sessionSelect.appendChild(firstOption);
                    
                    (data.sessions || []).forEach(sessionId => {
                        const option = document.createElement('option');
                        option.value = sessionId;
                        const label = sessionId.length > 22 ? sessionId.substring(0, 22) + '…' : sessionId;
                        option.textContent = label;
                        sessionSelect.appendChild(option);
                    });
                    const match = Array.from(sessionSelect.options).find(o => o.value === currentSessionId);
                    if (match) sessionSelect.value = currentSessionId;
                })
                .catch(error => {
                    console.error('加载会话列表错误:', error);
                });
        }

        /** 从服务端拉取 short_term 并渲染（与流式协议无关，仅展示 user / assistant 文本） */
        async function loadSessionHistory(sessionId) {
            if (!sessionId || sessionId === 'new') return;
            try {
                const res = await fetch('/api/sessions/' + encodeURIComponent(sessionId));
                if (res.status === 404) {
                    throw new Error('会话不存在或已过期');
                }
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const data = await res.json();
                messages = [];
                pendingToolApprovals.clear();
                messagesWrapper.innerHTML = '';
                const list = data.short_term || [];
                if (list.length === 0) {
                    showWelcomeScreen();
                    return;
                }
                for (const m of list) {
                    const role = m.role === 'user' ? 'user' : 'ai';
                    addMessage(role, m.content || '', false, 'text', { time: m.time });
                }
                hideWelcomeScreen();
                scrollToBottom();
            } catch (err) {
                messages = [];
                pendingToolApprovals.clear();
                messagesWrapper.innerHTML = '';
                showWelcomeScreen();
                showNotification('加载会话失败：' + (err && err.message ? err.message : '未知错误'));
            }
        }

        // 切换会话
        document.getElementById('sessionSelect').addEventListener('change', function(e) {
            const val = e.target.value;
            if (val === 'new') {
                createNewSession();
            } else {
                currentSessionId = val;
                loadSessionHistory(currentSessionId);
            }
        });

        // 添加淡入淡出动画
        const style = document.createElement('style');
        style.textContent = `
            @keyframes fadeInOut {
                0% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
                10% { opacity: 1; transform: translateX(-50%) translateY(0); }
                90% { opacity: 1; transform: translateX(-50%) translateY(0); }
                100% { opacity: 0; transform: translateX(-50%) translateY(-10px); }
            }
        `;
        document.head.appendChild(style);

        // 初始化
        window.onload = function() {
            configureMarked();
            loadSessions();
            messageInput.focus();
            showNotification('欢迎使用 AI Agent');
        };
    </script>
</body>
